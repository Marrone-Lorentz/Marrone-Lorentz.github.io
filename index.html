<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuste de Dose de Antibióticos</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #4a5568; }
        input[type="number"], input[type="text"], select {
            width: 100%; padding: 10px; border: 1px solid #cbd5e0;
            border-radius: 5px; box-sizing: border-box; font-size: 16px;
        }
        input[readonly] { background-color: #edf2f7; cursor: not-allowed; }
        .radio-group {
            display: flex; flex-direction: column; gap: 10px;
            background: #f8fafc; padding: 15px; border-radius: 5px; border: 1px solid #e2e8f0;
            margin-bottom: 15px;
        }
        .radio-item { display: flex; align-items: center; gap: 8px; }
        .radio-item input { width: auto; transform: scale(1.2); }
        .hidden { display: none; }
        #resultado-box {
            margin-top: 20px; padding: 15px; background-color: #ebf8ff;
            border-left: 5px solid #3182ce; border-radius: 4px; display: none;
        }
        .recomendacao-texto { font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-x: auto;}
    </style>
</head>
<body>

<div class="container">
    <h2>Ajuste de Antimicrobianos</h2>

    <div class="form-group">
        <label>Idade (anos):</label>
        <input type="number" id="idade" step="1" min="18" placeholder="Ex: 65">
    </div>

    <div class="form-group">
        <label>Peso (kg):</label>
        <input type="number" id="peso" step="0.1" min="30" placeholder="Ex: 70.5">
    </div>

    <div class="form-group">
        <label>Sexo:</label>
        <select id="sexo">
            <option value="">Selecione...</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
        </select>
    </div>

    <div class="form-group">
        <label>Creatinina (mg/dL):</label>
        <input type="number" id="creatinina" step="0.01" min="0.1" placeholder="Ex: 1.25">
    </div>

    <label>Função Renal:</label>
    <div class="radio-group">
        <div class="radio-item">
            <input type="radio" id="opt_auto" name="tipo_clearance" value="auto" checked>
            <label for="opt_auto">Clearance Automático (CKD-EPI 2021)</label>
        </div>
        <div id="div_auto" class="form-group" style="margin-left: 25px; margin-bottom: 0;">
            <input type="text" id="clearance_auto" readonly placeholder="Aguardando dados (Idade, Sexo, Cr)...">
        </div>

        <div class="radio-item">
            <input type="radio" id="opt_manual" name="tipo_clearance" value="manual">
            <label for="opt_manual">Clearance Manual</label>
        </div>
        <div id="div_manual" class="form-group hidden" style="margin-left: 25px; margin-bottom: 0;">
            <input type="number" id="clearance_manual" step="0.1" placeholder="Digite o ClCr (mL/min)">
        </div>

        <div class="radio-item">
            <input type="radio" id="opt_dialise" name="tipo_clearance" value="dialise">
            <label for="opt_dialise">Paciente Dialítico</label>
        </div>
    </div>

    <div class="form-group">
        <label>Antibiótico:</label>
        <select id="antibiotico">
            <option value="">Selecione a droga...</option>
        </select>
    </div>

    <div id="resultado-box">
        <h4 style="margin-top: 0; color: #2b6cb0;">Recomendação:</h4>
        <div id="texto_recomendacao" class="recomendacao-texto"></div>
    </div>

</div>
