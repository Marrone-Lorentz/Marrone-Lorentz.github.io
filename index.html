<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentas Médicas</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .header p {
            color: #718096;
            font-size: 18px;
            margin: 0;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            color: #2b6cb0;
            text-decoration: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .btn-menu:hover {
            border-color: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .btn-menu.desabilitado {
            background-color: #e2e8f0;
            color: #a0aec0;
            cursor: not-allowed;
            pointer-events: none; /* Impede o clique */
        }
        .icone {
            margin-right: 15px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Site Pika</h1>
        <p>Selecione a ferramenta desejada</p>
    </div>

    <div class="menu-container">
        <a href="antibioticos.html" class="btn-menu">
            <span class="icone">💊</span> Ajuste de Antibióticos
        </a>

        <a href="#" class="btn-menu desabilitado">
            <span class="icone">📝</span> Alta PIKA (Em breve)
        </a>
    </div>
	
	<div class="header">
    <p>by Marrone</p>
    </div>

</body>
</html>
